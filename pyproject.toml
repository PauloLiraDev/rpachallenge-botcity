[project]
name = "rpachallenge-botcity"
version = "1.0.0"
description = "Robô BotCity que resolve o Input Forms do rpachallenge.com"
requires-python = ">=3.11"
dependencies = [
    "botcity-framework-web==1.1.1",
    "botcity-maestro-sdk==0.9.1",
    "openpyxl==3.1.5",
    "pydantic==2.14.2",
    "setuptools==80.9.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.services.*", "src.domain.*", "src.utils.*"]
strict = true

[[tool.mypy.overrides]]
module = ["src.pages.*"]
disallow_untyped_defs = false
